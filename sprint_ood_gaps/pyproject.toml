[project]
name = "ood-gaps"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.3.15",
    "datasets>=5.1.0",
    "faiss-cpu>=1.15.1",
    "huggingface-hub>=2.2.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "py3langid>=0.4.0",
    "pyarrow>=26.0.0",
    "pystemmer>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=5.7.0",
    "simple-parsing>=0.1.9",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
